input_analyzer:
  description: >
    Analyze user inputs to identify key information such as destination, travel dates, expected duration.
    Extract and structure this information to be used by other agents.
  expected_output: >
    A structured output containing the extracted information from the user input, including:
    - destination: The location the user intends to travel to.
    - trip_date: The dates of the user's trip.
    - trip_duration: The expected duration of the user's trip.
  agent: input_analyzer

plan_travel_itinerary:
  description: >
    Expand the travel itinerary for a client based on the information analyzed by the input analyzer.
    You MUST provide recommendations using actual data for activities, safety tips, hotels, and budget options for both low and high budgets.
  expected_output: >
    A detailed travel itinerary that includes:
    - A list of recommended activities, hotels, and attractions in the destination city, categorized by low budget and high budget options.
    - Safety tips for travelers visiting the destination city.
    - Estimated costs for each activity and overall expected trip expenses for both low and high budget options.
  agent: travel_specialist

select_city:
  description: >
    Select the best cities for a client based on their preferences and the information from previous agents.
    Provide recommendations for activities, safety tips, and budget options.
  expected_output: >
    A list of recommended cities that match the client's preferences, along with a brief description of each city, nearby attractions, safety tips,
    and budget options for activities and accommodations.
  agent: city_selection

local_insights:
  description: >
    Provide insider tips and recommendations for a client visiting the city based on previous analysis.
    Include must-see attractions, local cuisine, safety tips, and budget-friendly options.
  expected_output: >
    A comprehensive guide for the client visiting the city, including:
    - A list of must-see attractions and hidden gems in the city.
    - Recommendations for local cuisine and dining options.
    - Safety tips for navigating the city.
    - Budget-friendly options for activities and accommodations.
  agent: local_expert