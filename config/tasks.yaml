input_analyzer:
  description: >
    Analyze this input {user_input} to identify key information such as destination, travel dates, expected duration.
    Extract and structure this information to be used by other agents.
  expected_output: >
    A structured output containing the extracted information from the user input, including:
    - destination: The location the user intends to travel to.
    - trip_date: The dates of the user's trip.
    - trip_duration: The expected duration of the user's trip.
  agent: input_analyzer

destination_expert_comprehensive:
  description: >
    Create a focused travel itinerary for the destination provided. Use web search to find current data.
    
    DO THIS IN ORDER (limit to 3 searches max):
    1. Search for top attractions, activities, and practical info about the destination
    2. Search for accommodation options (hotels, hostels) with price ranges for low and high budgets
    3. Search for safety tips, best time to visit, and transportation info
    
    Include: activities/attractions, 2 accommodation options (budget/luxury), costs, safety tips, and local tips.
    Keep responses concise and actionable. Do NOT make multiple searches for the same topic.
  expected_output: >
    A focused travel guide with:
    - TOP ATTRACTIONS & ACTIVITIES: Key things to see/do
    - ACCOMMODATIONS: Budget and luxury options with nightly rates
    - ESTIMATED COSTS: Total budget for low and high scenarios
    - PRACTICAL INFO: Transportation, best time to visit, safety tips
    - LOCAL TIPS: Food recommendations and cultural notes
  agent: destination_expert

toad_compilation:
  description: >
    Compile the information provided by the other agents into a comprehensive travel guide for a client, answering in their language.
    
    You have already received a complete travel plan from the destination_expert with all the details, recommendations, itineraries, budgets, and safety information.
    Your job is to format and present this information in a clear, user-friendly way that matches the client's preferences.
    Do NOT ask questions or request additional information - just format and organize the information you have received.
  expected_output: >
    A well-structured, user-friendly travel guide that synthesizes the insights from the destination expert into a cohesive format.
    The guide should be easy to read and navigate, providing clear sections for each aspect of the travel plan, and should be tailored to the client's preferences and needs.
    Format it with markdown for better readability (use headers, bullet points, bold text, etc).
  agent: toad